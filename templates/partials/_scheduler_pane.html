<div id="scheduler-pane" x-data="{ jobModalOpen: null }">
    <div class="container">
        <div class="flex-row justify-between align-center gap-md mb-sm">
            <div class="flex-row items-baseline gap-sm">
                <h2 class="m-0">Automated Jobs</h2>
            </div>
            <div class="flex-row gap-xs">
                <button type="button" class="secondary align-center gap-xs" @click="$store.manager.openHistoryModal()">
                    <span x-html="$store.icons.clock"></span> Build History
                </button>
                <button type="button" class="primary align-center gap-xs" @click="const newUid = $store.scheduler.addEntry(); $nextTick(() => jobModalOpen = newUid)">
                    <span x-html="$store.icons.plus"></span> Add New Job
                </button>
            </div>
        </div>

        <div class="table-container card">
            <table class="manager-table w-full">
                <thead>
                    <tr class="table-header-row">
                        <th class="table-cell text-left">Job Name</th>
                        <th class="table-cell text-left">Type</th>
                        <th class="table-cell text-left">Execution</th>
                        <th class="table-cell text-left">Source</th>
                        <th class="table-cell text-right">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-if="!$store.scheduler.isLoading && $store.scheduler.schedule.length === 0">
                        <tr><td colspan="5" class="table-loading">No scheduled jobs found.</td></tr>
                    </template>
                    <template x-for="(entry, idx) in $store.scheduler.schedule" :key="entry.id || entry._uid">
                        <tr class="table-row">
                            <td class="table-cell clickable">
                                <div class="flex-row align-center gap-sm">
                                    <span class="job-icon-status" :class="entry.id ? 'color-accent' : 'text-subtle'" x-html="$store.icons.clock"></span>
                                    <span class="job-name bold" @click="jobModalOpen = entry._uid" x-text="entry.playlist_name || 'Unnamed Job'"></span>
                                </div>
                            </td>
                            <td class="table-cell">
                                <span class="token-badge badge-accent" 
                                      :class="entry.job_type === 'enrichment' ? 'badge-accent' : (entry.job_type === 'quick_playlist' ? 'badge-outline-subtle' : (entry.create_as_collection ? 'collection-active' : 'playlist-active'))"
                                      x-text="entry.job_type === 'enrichment' ? 'ENRICHMENT' : (entry.job_type === 'quick_playlist' ? 'AUTO PLAYLIST' : (entry.create_as_collection ? 'COLLECTION' : 'PLAYLIST'))"></span>
                                <template x-if="!entry.enabled">
                                    <span class="badge" style="background: rgba(220,53,69,0.2); color: #ff6b6b; font-size: 0.65rem; margin-left: 0.25rem;">PAUSED</span>
                                </template>
                                <template x-if="entry.enabled && entry.snoozed_until">
                                    <span class="badge" style="background: rgba(255,193,7,0.2); color: #ffc107; font-size: 0.65rem; margin-left: 0.25rem;">SNOOZED</span>
                                </template>
                            </td>
                            <td class="table-cell">
                                <div class="schedule-summary-cell">
                                    <template x-if="entry.schedule_details?.frequency === 'interval'">
                                        <div class="time-part" x-text="'Every ' + entry.schedule_details.interval_minutes + 'm'"></div>
                                    </template>
                                    <template x-if="entry.schedule_details?.frequency !== 'interval'">
                                        <div>
                                            <span class="time-part" x-text="entry.schedule_details?.time || '12:00'"></span>
                                            <span class="freq-part" x-text="(entry.schedule_details?.days_of_week?.length === 7) ? 'Daily' : 'Weekly'"></span>
                                        </div>
                                    </template>
                                </div>
                            </td>

                            <td class="table-cell">
                                <span class="text-subtle" style="font-size: 0.9rem;" x-text="entry.job_type === 'quick_playlist' ? (entry.quick_playlist_data?.quick_playlist_type || 'Auto Playlist') : (entry.preset_name || '-')"></span>
                            </td>

                            <td class="table-cell text-right">
                                <div class="flex-row justify-end gap-sm">
                                    <button type="button" class="secondary small icon-only" :title="entry.enabled ? 'Pause Job' : 'Resume Job'" @click="$store.scheduler.toggleEnabled(entry, $el)" :style="!entry.enabled ? 'opacity: 0.5;' : ''">
                                        <span x-html="entry.enabled ? $store.icons.eyeOff : $store.icons.eye"></span>
                                    </button>
                                    <button type="button" class="secondary small icon-only" @click="$store.scheduler.runNow(entry.id, $el)" title="Run Now" x-html="$store.icons.play"></button>
                                    <button type="button" class="secondary small icon-only" @click="jobModalOpen = entry._uid" title="Edit Job" x-html="$store.icons.settings"></button>
                                    <button type="button" class="secondary small icon-only danger-hover" @click="$store.scheduler.removeEntry(entry, $el)" title="Remove Job" x-html="$store.icons.trash"></button>
                                </div>

                                <div class="modal-overlay sub-modal" x-show="jobModalOpen === entry._uid" x-cloak>
                                    <div class="modal-window wide" @click.outside="jobModalOpen = null">
                                        <div class="modal-header">
                                            <h2>Edit Automation Task</h2>
                                            <button type="button" class="icon-btn" @click="jobModalOpen = null">&times;</button>
                                        </div>
                                        <div class="modal-body modal-inner-form text-left">
                                            <div class="mb-md">
                                                <label class="field-label">Job Type</label>
                                                <select x-model="entry.job_type" class="w-full m-0" @change="if(entry.job_type === 'enrichment' && entry.playlist_name === 'New Scheduled Mix') entry.playlist_name = 'Library Enrichment'; if(entry.job_type === 'quick_playlist' && entry.playlist_name === 'New Scheduled Mix') entry.playlist_name = 'Scheduled Auto Playlist'">
                                                    <option value="builder">Standard Playlist / Collection</option>
                                                    <option value="quick_playlist">Auto Playlist</option>
                                                    <!-- Offered only while AI is available. Existing
                                                         enrichment schedules are kept but hidden, so this
                                                         option never appears as the only way to reach them. -->
                                                    <template x-if="$store.settings.generative_ai_available">
                                                        <option value="enrichment">Library Metadata Enrichment (AI)</option>
                                                    </template>
                                                </select>
                                            </div>

                                            <div class="filter-grid" style="grid-template-columns: 1.5fr 1fr; gap: 2rem;">
                                                <div>
                                                    <label class="field-label">Job Name</label>
                                                    <input type="text" x-model="entry.playlist_name" class="ghost-input w-full automation-config-item">
                                                </div>
                                                <template x-if="entry.job_type === 'builder'">
                                                    <div>
                                                        <label class="field-label">Output Mode</label>
                                                        <div class="toggle-pill">
                                                            <span class="pill-btn" :class="!entry.create_as_collection ? 'active' : ''" @click="entry.create_as_collection = false">Playlist</span>
                                                            <span class="pill-btn" x-show="$store.settings.can_manage_collections" x-cloak :class="entry.create_as_collection ? 'active' : ''" @click="entry.create_as_collection = true">Collection</span>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>

                                            <template x-if="entry.job_type === 'builder'">
                                                <div class="mt-lg">
                                                    <label class="field-label">Automation Preset</label>
                                                    <select x-model="entry.preset_id" class="mixer-select w-full"
                                                            @change="entry.preset_name = $store.presets.nameForId(entry.preset_id)">
                                                        <option value="">-- Select Builder Preset --</option>
                                                        <template x-for="preset in $store.presets.records" :key="preset.id">
                                                            <option :value="preset.id" x-text="preset.name"></option>
                                                        </template>
                                                    </select>
                                                    <div class="mt-sm p-sm rounded" style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-color, rgba(255,255,255,0.1));" x-show="entry.preset_id">
                                                        <div class="flex-row items-center gap-xs text-subtle" style="font-size: 0.8rem;">
                                                            <span class="bold">Active Rules:</span>
                                                            <span x-text="$store.scheduler.formatRulesSummary(entry.mix_options || ($store.presets.records.find(r => r.id === entry.preset_id)?.mix_options))"></span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>

                                            <template x-if="entry.job_type === 'quick_playlist'">
                                                <div class="mt-lg">
                                                    <label class="field-label">Auto Playlist Type</label>
                                                    <select x-model="entry.quick_playlist_data.quick_playlist_type" class="mixer-select w-full">
                                                        <option value="recently_added">Recently Added</option>
                                                        <option value="next_up">Next Up (TV)</option>
                                                        <option value="pilot_sampler">Pilot Sampler (TV)</option>
                                                        <option value="from_the_vault">From the Vault (Movies)</option>
                                                        <option value="top_community_unwatched">Top Community Picks (Movies)</option>
                                                        <option value="top_critic_unwatched">Top Critic Picks (Movies)</option>
                                                        <option value="artist_spotlight">Artist Spotlight (Music)</option>
                                                        <option value="genre_sampler">Music Genre Sampler</option>
                                                        <option value="album_roulette">Album Roulette (Music)</option>
                                                    </select>

                                                    <div class="mt-md" x-show="['recently_added', 'next_up', 'pilot_sampler', 'from_the_vault', 'top_community_unwatched', 'top_critic_unwatched', 'artist_spotlight', 'genre_sampler'].includes(entry.quick_playlist_data.quick_playlist_type)">
                                                        <label class="field-label">Number of Items</label>
                                                        <input type="number" x-model.number="entry.quick_playlist_data.options.count" min="1" max="500" class="themed-input w-full m-0">
                                                    </div>

                                                    <div class="mt-md" x-show="entry.quick_playlist_data.quick_playlist_type === 'artist_spotlight'">
                                                        <label class="field-label">Artist</label>
                                                        <select x-model="entry.quick_playlist_data.options.artist_id" class="mixer-select w-full">
                                                            <option value="">-- Select Artist --</option>
                                                            <template x-for="a in $store.mixer.library.artistData" :key="a.Id">
                                                                <option :value="a.Id" x-text="a.Name"></option>
                                                            </template>
                                                        </select>
                                                    </div>

                                                    <div class="mt-md" x-show="entry.quick_playlist_data.quick_playlist_type === 'genre_sampler'">
                                                        <label class="field-label">Music Genre</label>
                                                        <select x-model="entry.quick_playlist_data.options.genre" class="mixer-select w-full">
                                                            <option value="">-- Select Genre --</option>
                                                            <template x-for="g in $store.mixer.library.musicGenreData" :key="g.Name">
                                                                <option :value="g.Name" x-text="g.Name"></option>
                                                            </template>
                                                        </select>
                                                    </div>

                                                    <!-- Album Roulette Picker -->
                                                    <div class="mt-md" x-show="entry.quick_playlist_data.quick_playlist_type === 'album_roulette'">
                                                        <label class="field-label">Album Selection</label>
                                                        <div class="flex-row gap-sm align-center mb-sm">
                                                            <button type="button" class="secondary small align-center gap-xs" @click="
                                                                const res = await useApi(api.get('api/music/random_album'), $el, true, false);
                                                                if (res && res.data) {
                                                                    if (!entry.quick_playlist_data.options) entry.quick_playlist_data.options = {};
                                                                    const albId = res.data.Id || res.data.id;
                                                                    const albName = res.data.Name || res.data.name;
                                                                    entry.quick_playlist_data.options.album_id = albId;
                                                                    entry._selectedAlbumName = albName;
                                                                    if (!entry.playlist_name || entry.playlist_name === 'New Scheduled Mix' || entry.playlist_name === 'Scheduled Auto Playlist') {
                                                                        entry.playlist_name = 'Album: ' + albName;
                                                                    }
                                                                }
                                                            ">
                                                                <span x-html="$store.icons.shuffle"></span> Surprise Me (Pick Random)
                                                            </button>
                                                            <button type="button" class="secondary small align-center gap-xs" @click="
                                                                if (!entry.quick_playlist_data.options) entry.quick_playlist_data.options = {};
                                                                entry.quick_playlist_data.options.album_id = 'random';
                                                                entry._selectedAlbumName = 'Random album chosen on each run';
                                                            ">
                                                                <span x-html="$store.icons.refresh"></span> Rotate Every Run
                                                            </button>
                                                        </div>

                                                        <div class="card p-sm mb-sm" x-show="entry._selectedAlbumName || entry.quick_playlist_data?.options?.album_id" style="background: rgba(255,255,255,0.05); font-size: 0.85rem;">
                                                            <span class="text-subtle">Target Album: </span>
                                                            <span class="bold color-accent" x-text="entry.quick_playlist_data?.options?.album_id === 'random' ? 'Random album chosen on each run' : (entry._selectedAlbumName || entry.quick_playlist_data?.options?.album_id)"></span>
                                                        </div>

                                                        <div class="flex-col gap-sm">
                                                            <div>
                                                                <label class="field-label" style="font-size: 0.75rem;">Filter by Artist</label>
                                                                <select x-model="entry._selectedArtistId" class="mixer-select w-full" @change="$store.scheduler.loadAlbumsForArtist(entry, entry._selectedArtistId)">
                                                                    <option value="">-- Choose Artist --</option>
                                                                    <template x-for="art in ($store.mixer.library.artistData || [])" :key="art.Id || art.id">
                                                                        <option :value="art.Id || art.id" x-text="art.Name || art.name"></option>
                                                                    </template>
                                                                </select>
                                                            </div>

                                                            <div x-show="(entry._artistAlbums || []).length > 0">
                                                                <label class="field-label" style="font-size: 0.75rem;">Choose Album</label>
                                                                <select x-model="entry.quick_playlist_data.options.album_id" class="mixer-select w-full" @change="
                                                                    const alb = (entry._artistAlbums || []).find(a => (a.Id || a.id) === $el.value);
                                                                    if (alb) {
                                                                        entry._selectedAlbumName = alb.Name || alb.name;
                                                                        if (!entry.playlist_name || entry.playlist_name === 'New Scheduled Mix' || entry.playlist_name === 'Scheduled Auto Playlist') {
                                                                            entry.playlist_name = 'Album: ' + (alb.Name || alb.name);
                                                                        }
                                                                    }
                                                                ">
                                                                    <option value="">-- Select Album --</option>
                                                                    <template x-for="alb in (entry._artistAlbums || [])" :key="alb.Id || alb.id">
                                                                        <option :value="alb.Id || alb.id" x-text="alb.Name || alb.name"></option>
                                                                    </template>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>

                                            <div class="mt-lg">
                                                <label class="field-label">Trigger Sources</label>
                                                <div class="flex-row gap-md">
                                                    <label class="align-center gap-xs" style="font-size: 0.85rem;">
                                                        <input type="checkbox" value="clock" :checked="(entry.trigger_sources || []).includes('clock')" @change="$event.target.checked ? (entry.trigger_sources = [...(entry.trigger_sources || []), 'clock']) : (entry.trigger_sources = (entry.trigger_sources || []).filter(s => s !== 'clock'))">
                                                        Clock
                                                    </label>
                                                    <label class="align-center gap-xs" style="font-size: 0.85rem;">
                                                        <input type="checkbox" value="watch" :checked="(entry.trigger_sources || []).includes('watch')" @change="$event.target.checked ? (entry.trigger_sources = [...(entry.trigger_sources || []), 'watch']) : (entry.trigger_sources = (entry.trigger_sources || []).filter(s => s !== 'watch'))">
                                                        Watched Webhook
                                                    </label>
                                                    <label class="align-center gap-xs" style="font-size: 0.85rem;">
                                                        <input type="checkbox" value="library" :checked="(entry.trigger_sources || []).includes('library')" @change="$event.target.checked ? (entry.trigger_sources = [...(entry.trigger_sources || []), 'library']) : (entry.trigger_sources = (entry.trigger_sources || []).filter(s => s !== 'library'))">
                                                        Library Webhook
                                                    </label>
                                                </div>
                                            </div>

                                            <template x-if="entry.job_type === 'enrichment' && $store.settings.generative_ai_available">
                                                <div class="filter-grid mt-lg" style="grid-template-columns: 1fr 1fr; gap: 2rem;">
                                                    <div>
                                                        <label class="field-label">Batch Size (Max: 500)</label>
                                                        <input type="number" 
                                                               x-model.number="entry.enrichment_data.batch_size" 
                                                               min="1" 
                                                               max="500" 
                                                               @change="entry.enrichment_data.batch_size = Math.min(Math.max($event.target.value, 1), 500)"
                                                               class="w-full themed-input m-0">
                                                    </div>
                                                    <div>
                                                        <label class="field-label">AI Timeout (Max: 600)</label>
                                                        <input type="number" 
                                                               x-model.number="entry.enrichment_data.timeout" 
                                                               min="10" 
                                                               max="600" 
                                                               @change="entry.enrichment_data.timeout = Math.min(Math.max($event.target.value, 10), 600)"
                                                               class="w-full themed-input m-0">
                                                    </div>
                                                </div>
                                            </template>

                                            <div class="automation-config-card" x-show="entry.schedule_details">
                                                <div class="flex-row justify-between align-center mb-md">
                                                    <label class="field-label m-0">Execution Mode</label>
                                                    <div class="toggle-pill">
                                                        <span class="pill-btn" :class="entry.schedule_details.frequency !== 'interval' ? 'active' : ''" @click="entry.schedule_details.frequency = 'daily'">Fixed Time</span>
                                                        <span class="pill-btn" :class="entry.schedule_details.frequency === 'interval' ? 'active' : ''" @click="entry.schedule_details.frequency = 'interval'">Interval</span>
                                                    </div>
                                                </div>
                                                <div x-show="entry.schedule_details.frequency !== 'interval'" x-transition>
                                                    <div class="flex-row justify-between align-center mb-md">
                                                        <label class="field-label m-0">Execution Time</label>
                                                        <input type="time" x-model="entry.schedule_details.time" class="themed-input w-auto">
                                                    </div>
                                                    <div class="flex-row justify-between gap-sm">
                                                        <template x-for="(day, i) in ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']" :key="i">
                                                            <button type="button" class="day-btn grow-1" :class="(entry.schedule_details?.days_of_week || []).includes(i) ? 'active' : ''" @click="$store.scheduler.toggleDay(entry, i)" x-text="day"></button>
                                                        </template>
                                                    </div>
                                                </div>
                                                <div x-show="entry.schedule_details.frequency === 'interval'" x-transition>
                                                    <div class="flex-row align-center gap-md">
                                                        <label class="field-label m-0">Run Every</label>
                                                        <input type="number" x-model.number="entry.schedule_details.interval_minutes" min="1" class="themed-input w-80 text-center">
                                                        <span class="text-subtle">Minutes</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="primary align-center gap-xs" @click="$store.scheduler.saveSchedule(entry, $el); jobModalOpen = null">
                                                <span x-html="$store.icons.save"></span> Save Automation
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</div>
