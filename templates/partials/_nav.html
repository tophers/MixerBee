<!-- templates/partials/_nav.html -->
<div class="main-header-bar">
    <div class="header-user-display">
        <div class="connection-switcher">
            <label for="connection-select">Media connection</label>
            <select id="connection-select" :value="$store.settings.selectedConnection" @change="$store.settings.selectConnection($event.target.value)">
                <option value="" disabled x-text="$store.settings.connections.length ? 'Select a connection' : 'No connections yet'"></option>
                <template x-for="connection in $store.settings.connections" :key="connection.id">
                    <option :value="connection.id" :selected="connection.id === $store.settings.selectedConnection" x-text="connection.label || (connection.username + ' · ' + connection.base_url)"></option>
                </template>
            </select>
            <button type="button" class="secondary header-add-connection" @click="$store.settings.newConnection()" title="Add media connection" aria-label="Add media connection">
                <span aria-hidden="true">＋</span><span class="header-add-label">Add</span>
            </button>
        </div>

        <button type="button"
                class="secondary header-iq-trigger"
                x-show="$store.settings.activeUserId && $store.settings.generative_ai_available"
                x-cloak
                @click="$store.modals.aiHubAction.show()"
                :title="'Library IQ: ' + ($store.ai.libraryIq?.percentage || 0) + '% · Click to open AI & Library Intelligence'">
            <span class="iq-zap-icon" :class="$store.ai.enrichmentStatus?.status === 'running' ? 'spin' : ''" x-html="$store.icons.zap"></span>
            <span class="header-iq-label" x-text="($store.ai.enrichmentStatus?.status === 'running' ? 'Enriching ' : 'IQ ') + ($store.ai.libraryIq?.percentage || 0) + '%'"></span>
        </button>

        <!-- Owner-only, and only while capture is on. Not gated on activeUserId: the
             drawer has to be reachable when no connection exists or a server is down. -->
        <button type="button"
                id="log-drawer-trigger"
                class="secondary header-logs-trigger"
                x-show="$store.logs.available || $store.logs.isOpen"
                x-cloak
                :class="$store.logs.isOpen ? 'is-active' : ''"
                :aria-expanded="$store.logs.isOpen.toString()"
                aria-controls="log-drawer"
                @click="$store.logs.toggle()"
                title="Live logs (all accounts and servers)">
            <span x-html="$store.icons.list"></span>
            <span class="header-logs-label">Live logs</span>
        </button>

        <div class="account-menu" @click.outside="$store.settings.accountMenuOpen = false">
            <button type="button" class="secondary account-menu-trigger" @click="$store.settings.accountMenuOpen = !$store.settings.accountMenuOpen" :aria-expanded="$store.settings.accountMenuOpen.toString()">
                <span class="account-avatar" x-text="($store.settings.account?.username || '?').charAt(0).toUpperCase()"></span>
                <span class="account-menu-name" x-text="$store.settings.account?.username || 'Account'"></span>
                <span x-show="$store.settings.pendingWebhookCount" x-cloak class="account-alert-badge" x-text="$store.settings.pendingWebhookCount" title="Webhook setup requests"></span>
                <span class="account-menu-chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="account-menu-panel" x-show="$store.settings.accountMenuOpen" x-transition x-cloak>
                <div class="account-menu-identity">
                    <strong x-text="$store.settings.account?.username"></strong>
                    <span>Local MixerBee account</span>
                </div>
                <button type="button" @click="$store.settings.accountMenuOpen = false; $store.settings.show()"><span x-html="$store.icons.settings"></span> Connection settings</button>
                <button type="button" @click="$store.settings.accountMenuOpen = false; $store.settings.showAccount()"><span x-html="$store.icons.user"></span> Account settings</button>
                <button type="button" @click="$store.settings.accountMenuOpen = false; $store.modals.shortcuts.isOpen = true"><span x-html="$store.icons.keyboard"></span> Keyboard shortcuts <kbd class="ml-auto">?</kbd></button>
                <button type="button" class="account-menu-signout" @click="$store.settings.accountMenuOpen = false; $store.settings.logout()">Sign out</button>
            </div>
        </div>
    </div>
</div>

<div id="typewriter-overlay">
    <div class="typewriter-wrapper">
        <h2 class="typewriter-header">
            <span id="typed-text"></span>
        </h2>
    </div>
</div>

<div class="tab-switcher" role="tablist" aria-label="Sections">
    <button class="tab-btn" role="tab" :aria-selected="($store.ui.currentTab === 'mixed').toString()" title="Shortcut: 1" :class="{ 'active': $store.ui.currentTab === 'mixed' }" @click="$store.ui.setTab('mixed')">Builder</button>
    <button class="tab-btn" x-show="$store.settings.generative_ai_available" x-cloak role="tab" :aria-selected="($store.ui.currentTab === 'assist').toString()" title="Shortcut: 2" :class="{ 'active': $store.ui.currentTab === 'assist' }" @click="$store.ui.setTab('assist')">Assist</button>
    <button class="tab-btn" role="tab" :aria-selected="($store.ui.currentTab === 'scheduler').toString()" title="Shortcut: 3" :class="{ 'active': $store.ui.currentTab === 'scheduler' }" @click="$store.ui.setTab('scheduler')">Scheduler</button>
    <button class="tab-btn" role="tab" :aria-selected="($store.ui.currentTab === 'manager').toString()" title="Shortcut: 4" :class="{ 'active': $store.ui.currentTab === 'manager' }" @click="$store.ui.setTab('manager')">Manager</button>
</div>
