<div id="access-gate-overlay">
    <form id="access-gate-form" class="access-gate-card">
        <div class="access-gate-brand" aria-hidden="true">🐝</div>
        <div class="access-gate-heading">
            <h1 id="login-title">Sign in to MixerBee</h1>
            <p>Use your local MixerBee account to open your workspace.</p>
        </div>
        <div id="setup-instructions" class="setup-instructions" hidden>
            <strong>First-time setup</strong>
            <p>Create an administrator account to set up and manage this MixerBee installation.</p>
        </div>
        <label class="access-gate-field" for="login-username">
            <span>Username</span>
            <input id="login-username" type="text" autocomplete="username" required maxlength="64" autocapitalize="none" spellcheck="false">
        </label>
        <label class="access-gate-field" for="login-password">
            <span>Password</span>
            <input id="login-password" type="password" autocomplete="current-password" required maxlength="256">
        </label>
        <p id="password-requirement" class="access-gate-help" hidden>Use at least 10 characters for your new password.</p>
        <div id="access-gate-error" class="access-gate-error" role="alert"></div>
        <button class="access-gate-submit" type="submit">Sign in</button>
    </form>
</div>
